name: BluetoothRelay
options:
  bundleIdPrefix: jp.example.bluetoothrelay
  deploymentTarget:
    iOS: "16.0"
targets:
  BluetoothRelay:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.bluetoothrelay.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
