name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGenをインストールしてプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 署名なしでビルド
        run: |
          xcodebuild -project BluetoothRelay.xcodeproj -scheme BluetoothRelay \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPAにまとめる
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BluetoothRelay.app Payload/
          zip -qr BluetoothRelay.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BluetoothRelay-ipa
          path: BluetoothRelay.ipa
