name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGenをインストールしてプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 署名なしでビルド
        run: |
          xcodebuild -project KokologRelay.xcodeproj -scheme KokologRelay \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPAにまとめる
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KokologRelay.app Payload/
          zip -qr KokologRelay.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KokologRelay-ipa
          path: KokologRelay.ipa
