name: pc-monitor-exe
on:
  push:
    paths: ['pc_monitor.py', 'pc_receiver.py', '.github/workflows/pc-monitor-exe.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要なものを入れる
        run: pip install websockets zeroconf matplotlib nuitka
      - name: exeを作る(Nuitka。Pythonが入っていないPCでも動く)
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads --enable-plugin=matplotlib --include-package=zeroconf --include-package=websockets --output-dir=dist pc_monitor.py
          python -m nuitka --onefile --assume-yes-for-downloads --include-package=zeroconf --include-package=websockets --output-dir=dist pc_receiver.py
      - uses: actions/upload-artifact@v4
        with:
          name: pc-tools-windows
          path: dist/*.exe
